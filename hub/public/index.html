<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cloud-march hub</title>
    <style>
      :root {
        --bg: #0e0f13;
        --card: #16181e;
        --line: #262a33;
        --text: #e7e7ea;
        --muted: #9aa0ac;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .wrap { max-width: 780px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
      header h1 { margin: 0; font-size: 1.6rem; }
      header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.95rem; }
      .grid { margin-top: 2rem; display: grid; gap: 1rem; }
      .card {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 14px;
        padding: 1.1rem 1.2rem;
      }
      .card .top { display: flex; align-items: flex-start; gap: 0.75rem; }
      .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: none; background: #555; }
      .dot.stopped { background: #555; }
      .dot.starting { background: var(--accent); animation: pulse 1s infinite; }
      .dot.running { background: #34d399; }
      .dot.error { background: #f87171; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .meta { flex: 1; min-width: 0; }
      .name { font-weight: 600; font-size: 1.05rem; }
      .tag { color: var(--muted); font-size: 0.8rem; }
      .desc { color: var(--muted); font-size: 0.88rem; margin-top: 0.4rem; }
      .status { font-size: 0.8rem; color: var(--muted); margin-left: auto; white-space: nowrap; }
      .actions { display: flex; gap: 0.5rem; margin-top: 0.9rem; flex-wrap: wrap; }
      button, a.btn {
        font: inherit; font-size: 0.9rem; cursor: pointer; text-decoration: none;
        border-radius: 9px; padding: 0.5rem 0.9rem; border: 1px solid var(--line);
        background: #1e2129; color: var(--text); transition: all 0.15s;
      }
      button:hover, a.btn:hover { border-color: #3a4150; }
      button:disabled { opacity: 0.4; cursor: default; }
      .btn-play { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
      .btn-open { background: #14351f; border-color: #1f5c34; color: #7ee2a8; font-weight: 600; }
      .btn-ghost { background: transparent; }
      .logs {
        margin-top: 0.8rem; display: none; background: #0b0c10; border: 1px solid var(--line);
        border-radius: 9px; padding: 0.6rem 0.75rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.72rem; color: #b7bdc9; white-space: pre-wrap; max-height: 190px; overflow: auto;
      }
      .logs.show { display: block; }
      .banner {
        display: none; margin-top: 1.25rem; padding: 0.7rem 1rem; border-radius: 10px;
        background: #3a1d1d; border: 1px solid #6b2b2b; color: #ffb4b4; font-size: 0.9rem;
      }
      .banner.show { display: block; }
      footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.8rem; }
      code { background: #1e2129; padding: 0.1rem 0.35rem; border-radius: 5px; font-size: 0.85em; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>cloud-march hub</h1>
        <p>Six projects, one place. Hit <strong>Play</strong> to start a dev server, then open it.</p>
      </header>

      <div id="banner" class="banner">⚠ Hub not reachable — is it still running? Start it with <code>pnpm dev</code>.</div>

      <div class="grid" id="grid"></div>

      <footer>
        Servers run on your machine and stop when you quit the hub (<code>Ctrl-C</code>). Each also has a
        <strong>Stop</strong> button here.
      </footer>
    </div>

    <script>
      const STATUS_LABEL = { stopped: 'Stopped', starting: 'Starting…', running: 'Running', error: 'Error' };
      const logsOpen = new Set();

      async function api(path, method = 'GET') {
        const res = await fetch(path, { method });
        return res.json();
      }

      function cardHtml(p) {
        const running = p.status === 'running';
        const starting = p.status === 'starting';
        return `
          <div class="card" data-id="${p.id}">
            <div class="top">
              <span class="dot ${p.status}"></span>
              <div class="meta">
                <div class="name">${p.name}</div>
                <div class="tag">${p.tag} · :${p.port}</div>
                <div class="desc">${p.desc}</div>
              </div>
              <div class="status">${STATUS_LABEL[p.status] || p.status}</div>
            </div>
            <div class="actions">
              ${
                running || starting
                  ? `<button class="btn-stop btn-ghost" data-act="stop">Stop</button>`
                  : `<button class="btn-play" data-act="start">▶ Play</button>`
              }
              ${running ? `<a class="btn btn-open" href="${p.url}" target="_blank" rel="noopener">Open ↗</a>` : ''}
              ${starting ? `<button class="btn" disabled>Starting…</button>` : ''}
              <button class="btn btn-ghost" data-act="logs">Logs</button>
            </div>
            <pre class="logs ${logsOpen.has(p.id) ? 'show' : ''}" data-logs></pre>
          </div>`;
      }

      let lastSig = '';
      function setBanner(show) {
        document.getElementById('banner').classList.toggle('show', show);
      }
      async function refresh() {
        let projects;
        try {
          ({ projects } = await api('/api/projects'));
        } catch {
          // Hub is down/restarting — surface it instead of leaving dead buttons.
          setBanner(true);
          return;
        }
        setBanner(false);
        const sig = JSON.stringify(projects.map((p) => p.status));
        if (sig !== lastSig) {
          lastSig = sig;
          document.getElementById('grid').innerHTML = projects.map(cardHtml).join('');
        }
        // Refresh any open log panels.
        for (const id of logsOpen) {
          try {
            const { logs } = await api(`/api/projects/${id}/logs`);
            const el = document.querySelector(`.card[data-id="${id}"] [data-logs]`);
            if (el) {
              const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
              el.textContent = logs;
              if (atBottom) el.scrollTop = el.scrollHeight;
            }
          } catch {
            /* ignore transient log fetch errors */
          }
        }
      }

      document.getElementById('grid').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const card = btn.closest('.card');
        const id = card.dataset.id;
        const act = btn.dataset.act;

        // Pure client-side toggle — no server call, no re-render.
        if (act === 'logs') {
          logsOpen.has(id) ? logsOpen.delete(id) : logsOpen.add(id);
          card.querySelector('[data-logs]').classList.toggle('show');
          return;
        }

        btn.disabled = true;
        try {
          if (act === 'start') {
            logsOpen.add(id); // show logs while it boots / if it fails
            await api(`/api/projects/${id}/start`, 'POST');
          } else if (act === 'stop') {
            await api(`/api/projects/${id}/stop`, 'POST');
          }
        } catch (err) {
          // Never leave the user with a dead button and no explanation.
          alert(`Hub request failed: ${err.message}\n\nIs the hub still running? (pnpm dev)`);
        } finally {
          lastSig = ''; // force a re-render so the button state resets
          refresh();
        }
      });

      refresh();
      setInterval(refresh, 1500);
    </script>
  </body>
</html>
