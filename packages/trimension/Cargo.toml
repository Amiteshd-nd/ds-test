[workspace]
resolver = "2"
members = [
    "crates/doc",
    "crates/commit",
    "crates/geom2d",
    "crates/solid",
    "crates/import-dxf",
    "crates/render",
    "crates/api",
    "crates/wasm",
    "crates/server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "UNLICENSED"
publish = false

# Versions resolved from crates.io on 2026-09-11. See VERSIONS.md.
# Do not bump from memory.
[workspace.dependencies]
tri-doc = { path = "crates/doc" }
tri-commit = { path = "crates/commit" }
tri-geom2d = { path = "crates/geom2d" }
tri-solid = { path = "crates/solid" }
tri-import-dxf = { path = "crates/import-dxf" }
tri-render = { path = "crates/render" }
tri-api = { path = "crates/api" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2.2"
slotmap = { version = "1.1.1", features = ["serde"] }
rstar = "0.13.0"
dxf = "0.6.1"
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12", "webgpu", "webgl"] }
axum = "0.8.9"
thiserror = "2"
blake3 = "1"

[profile.release]
opt-level = 3
lto = "thin"
