[package]
name = "tri-import-dxf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tri-doc = { workspace = true }
tri-commit = { workspace = true }
tri-geom2d = { workspace = true }
dxf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The `dxf` crate pulls `uuid`, which refuses to build for wasm32-unknown-unknown
# without an explicit randomness source. Feature unification from here is enough.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.1", features = ["js"] }
