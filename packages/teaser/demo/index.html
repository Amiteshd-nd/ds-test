<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Plinth teaser mockup</title>
<meta name="viewport" content="width=1920, height=1080" />
<!--
  Self-contained 1920x1080 mockup. Every movement sits on one paused GSAP timeline
  (window.tl); window.seek(seconds) renders any instant deterministically.
  The film is a list of scenes (script.json), each a fresh chat session with its
  own plan SVG; between scenes the cursor clicks "New chat".
  Fonts are requested from Google Fonts and ALSO embedded as base64 (fonts.css,
  generated by render/fonts.ts). The embedded rules come last, so they win and
  a headless render never waits on the network.
  Audio cues (keystrokes, sends, clicks, chimes) are collected in window.events
  while the timeline is built; render/capture.ts writes them to out/events.json
  and render/audio.ts synthesises the soundtrack from them.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=block" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --line: #e6e3dc;
    --line-strong: #d3cfc6;
    --ink: #141414;
    --ink-2: #5f5c56;
    --ink-3: #9a968e;
    --dot: #cfcbc2;
    --mint: #bdeedb;
    --mint-ink: #0f5c43;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.06), 0 8px 24px -12px rgba(20, 20, 20, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    cursor: none;
    font-feature-settings: 'cv11', 'ss01';
  }
  #app { position: relative; width: 1920px; height: 1080px; display: flex; background: var(--bg); }

  /* ---------- canvas ---------- */
  #canvas {
    position: relative;
    width: 68%;
    height: 100%;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px);
    background-size: 24px 24px;
    background-position: 12px 12px;
    overflow: hidden;
  }
  #hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 34px;
    color: var(--ink-3);
    letter-spacing: -0.005em;
    pointer-events: none;
  }
  #shimmer {
    position: absolute; top: 0; bottom: 0; left: 0; width: 60%;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%);
    opacity: 0;
    transform: translateX(-100%);
    pointer-events: none;
  }
  #toolbar {
    position: absolute; top: 20px; left: 20px;
    display: flex; align-items: center; gap: 2px;
    padding: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  #toolbar .tool { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; color: var(--ink-2); }
  #toolbar .tool.active { background: var(--ink); color: #fff; }
  #toolbar .tool svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
  #toolbar .file { font-size: 13px; font-weight: 500; color: var(--ink); padding: 0 10px 0 6px; white-space: nowrap; }
  #zoom {
    position: absolute; right: 20px; bottom: 20px;
    display: flex; align-items: center; gap: 2px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: 13px; font-weight: 500; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  #zoom .btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 16px; }
  #zoom .val { padding: 0 8px; color: var(--ink); }
  #drafting {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 10px;
    background: var(--ink); color: #fff;
    border-radius: 999px;
    font-size: 13px; font-weight: 500;
    opacity: 0;
    white-space: nowrap;
  }
  #drafting .spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); border-top-color: #fff; }
  #toast {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 10px 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow);
    font-size: 14px; font-weight: 500; color: var(--ink);
    opacity: 0; visibility: hidden;
    white-space: nowrap;
  }
  #toast .ok { width: 20px; height: 20px; border-radius: 50%; background: var(--mint); color: var(--mint-ink); display: flex; align-items: center; justify-content: center; }
  #toast .ok svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #planwrap { position: absolute; inset: 0; }
  .plan {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 56px 40px 40px;
    opacity: 0; visibility: hidden;
  }
  .plan svg { max-height: 930px; max-width: 1225px; width: 100%; height: 100%; overflow: visible; }
  .plan text { font-family: 'Inter', system-ui, sans-serif; }

  /* ---------- chat ---------- */
  #chat {
    position: relative;
    width: 32%; height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
  }
  #chat header {
    display: flex; align-items: center; justify-content: space-between;
    height: 72px; padding: 0 28px;
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-family: 'UnifrakturCook', 'Instrument Serif', serif;
    font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.005em;
    color: var(--ink);
  }
  #chat header .right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); }
  #newchat {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px 7px 9px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: #fff;
    font-size: 13px; font-weight: 500; color: var(--ink);
    white-space: nowrap;
  }
  #newchat svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  #chat header .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #e9e5db, #cfc8b8); border: 1px solid var(--line-strong); }
  #messages { position: relative; flex: 1; overflow: hidden; }
  .session {
    position: absolute; inset: 0; padding: 28px 28px 0;
    display: flex; flex-direction: column; gap: 22px;
    opacity: 0; visibility: hidden;
  }
  .msg { display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
  .msg .who { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
  .msg .who .badge { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 999px; background: var(--mint); color: var(--mint-ink); }
  .msg .body { font-size: 15.5px; line-height: 1.5; color: var(--ink); }
  .msg.user { align-items: flex-end; }
  .msg.user .body { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 18px 18px 4px 18px; max-width: 88%; }
  .msg .body .w { opacity: 0; }                     /* streamed word */
  .hidden-msg { opacity: 0; }

  .thinking { display: flex; align-items: center; gap: 12px; height: 24px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: 0.25; }
  .status { position: relative; height: 24px; flex: 1; }
  .status span { position: absolute; left: 0; top: 0; line-height: 24px; font-size: 14px; color: var(--ink-2); opacity: 0; white-space: nowrap; }

  table.areas { border-collapse: separate; border-spacing: 0; margin-top: 8px; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; max-width: 380px; opacity: 0; }
  table.areas tr { opacity: 0; }
  table.areas td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  table.areas td:first-child { color: var(--ink-2); }
  table.areas td:last-child { text-align: right; color: var(--ink); white-space: nowrap; }
  table.areas td:last-child small { color: var(--ink-3); font-size: 12px; margin-left: 5px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .pill { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff; font-size: 14px; font-weight: 500; color: var(--ink); opacity: 0; transform: translateY(6px); white-space: nowrap; }

  #composer { padding: 18px 28px 28px; }
  #input {
    position: relative;
    display: flex; align-items: center;
    min-height: 56px; padding: 14px 64px 14px 18px;
    border: 1px solid var(--line-strong); border-radius: 16px;
    background: #fff;
    box-shadow: 0 0 0 0 rgba(20,20,20,0);
    font-size: 15.5px; line-height: 1.45;
  }
  #placeholder { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
  #typed { white-space: pre; }
  #typed .c { opacity: 0; display: none; }
  #caret { display: inline-block; width: 1.5px; height: 20px; background: var(--ink); margin-left: 1px; vertical-align: -4px; opacity: 0; }
  #send {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.35;
  }
  #send svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #composer .fine { margin-top: 10px; font-size: 12px; color: var(--ink-3); text-align: center; }

  /* ---------- cursor ---------- */
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 28px; pointer-events: none; z-index: 50; transform-origin: 3px 2px; }

  /* ---------- outro ---------- */
  #outro {
    position: absolute; inset: 0; z-index: 40;
    background: var(--brand, #141414);
    color: var(--brand-ink, #f4f1ea);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    opacity: 0;
  }
  #outro .wordmark { font-size: 148px; color: inherit; opacity: 0; transform: translateY(14px); }
  #outro .line { font-family: 'Instrument Serif', Georgia, serif; font-size: 46px; letter-spacing: -0.01em; opacity: 0; transform: translateY(12px); }
  #outro .line .sep { opacity: 0.45; margin: 0 0.35em; }
  #outro .line .domain { font-style: italic; }

  /* ---------- scrub bar (preview only, ?scrub=1) ---------- */
  #scrub { display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 100; padding: 10px 16px; background: rgba(20,20,20,0.9); color: #fff; font: 12px/1 Inter, monospace; align-items: center; gap: 12px; }
  #scrub input { flex: 1; }
  body.scrub #scrub { display: flex; }
  body.scrub { cursor: default; }
</style>
</head>
<body>
<div id="app">
  <section id="canvas">
    <div id="hint"></div>
    <div id="shimmer"></div>
    <div id="planwrap"></div>
    <div id="toolbar">
      <div class="tool active"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></div>
      <div class="tool"><svg viewBox="0 0 24 24"><path d="M4 18V6M20 18V6M4 12h16"/></svg></div>
      <div class="tool"><svg viewBox="0 0 24 24"><path d="M5 20V4h10v16M15 4a8 8 0 0 1 4 7"/></svg></div>
      <div class="tool"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M12 5v14M4 12h16"/></svg></div>
      <div class="tool"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg></div>
      <div class="tool"><svg viewBox="0 0 24 24"><path d="M3 17l14-14 4 4L7 21zM8 12l2 2M11 9l2 2M14 6l2 2"/></svg></div>
      <div class="sep"></div>
      <div class="file" id="filename"></div>
    </div>
    <div id="zoom"><div class="btn">−</div><div class="val" id="zoomval"></div><div class="btn">+</div></div>
    <div id="drafting"><div class="spin"></div><span id="draftinglabel"></span></div>
    <div id="toast"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><span id="toastlabel"></span></div>
  </section>

  <aside id="chat">
    <header>
      <div class="wordmark" id="wordmark"></div>
      <div class="right">
        <div id="newchat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="newchatlabel"></span></div>
        <div class="avatar"></div>
      </div>
    </header>
    <div id="messages"></div>
    <div id="composer">
      <div id="input">
        <span id="placeholder"></span>
        <span id="typed"></span><span id="caret"></span>
        <div id="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      </div>
      <div class="fine">Plans are drafts. Check setbacks and codes with your architect.</div>
    </div>
  </aside>

  <svg id="cursor" viewBox="0 0 22 28" xmlns="http://www.w3.org/2000/svg">
    <path d="M3 2l14.5 12.2-6.3.6 3.6 7.9-2.8 1.3-3.6-7.9L3 20.3z" fill="#141414" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>

  <div id="outro">
    <div class="wordmark" id="outro-wordmark"></div>
    <div class="line" id="outro-line"></div>
  </div>

  <div id="scrub"><span id="scrub-time">0.000</span><input type="range" min="0" max="2160" value="0" step="1" /><span id="scrub-frame">f0</span></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(async () => {
  const script = await (await fetch('script.json')).json();
  const $ = (s, scope = document) => scope.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const events = [];            // audio cues: {t, kind}
  window.events = events;
  const nameSchedule = [];      // file-name swaps: {t, name}, applied in seek()
  const pendingShow = [];       // sessions to reveal: {index, t}

  // ---- static copy ---------------------------------------------------------
  document.title = `${script.product.name} teaser mockup`;
  document.documentElement.style.setProperty('--brand', script.product.brandColor);
  document.documentElement.style.setProperty('--brand-ink', script.product.brandInk);
  $('#hint').textContent = script.canvas.emptyHint;
  $('#draftinglabel').textContent = script.canvas.draftingPill;
  $('#zoomval').textContent = script.canvas.zoom;
  $('#wordmark').textContent = script.product.name;
  $('#outro-wordmark').textContent = script.product.name;
  $('#newchatlabel').textContent = script.chat.newChat;
  $('#placeholder').textContent = script.chat.inputPlaceholder;
  $('#filename').textContent = script.scenes[0].fileName;
  document.querySelectorAll('#toolbar .tool').forEach((t, i) => { t.title = script.canvas.toolbar[i] ?? ''; });
  {
    const line = $('#outro-line');
    line.append(script.outro.line);
    line.append(el('span', 'sep', script.outro.separator));
    line.append(el('span', 'domain', script.product.domain));
  }

  // ---- helpers ----------------------------------------------------------------
  function numToFt(n) { let f = Math.floor(n + 1e-6); let i = Math.round((n - f) * 12); if (i === 12) { f++; i = 0; } return `${f}'${i}"`; }
  // seeded jitter (mulberry32) so the typing rhythm is identical on every run
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const words = (container, text) => text.split(' ').map((w, i, arr) => { const s = el('span', 'w', w + (i < arr.length - 1 ? ' ' : '')); container.append(s); return s; });
  const isStrokeShape = (n) => ['path', 'rect', 'circle', 'ellipse', 'line', 'polyline', 'polygon'].includes(n.tagName);
  const drawable = (n) => isStrokeShape(n) && !n.getAttribute('stroke-dasharray') && n.getAttribute('stroke') !== '#fff' && n.getAttribute('fill') !== '#141414' && n.getAttribute('fill') !== '#fff';

  // lazy:false so a seek writes every value synchronously, with no tick in between
  gsap.defaults({ overwrite: false, lazy: false });
  const tl = gsap.timeline({ paused: true });
  window.tl = tl;
  const penSchedule = [];      // {start, end, el, len, svg, pen}
  const counters = [];         // {el, obj, format, suffix}
  const cursor = $('#cursor');
  const app = $('#app');
  gsap.set(app, { transformOrigin: '0 0' });
  gsap.set(cursor, { x: 1180, y: 720 });

  const rect = (node) => node.getBoundingClientRect();   // only valid at camera scale 1, i.e. build time
  const inputR = rect($('#input')), sendR = rect($('#send')), newR = rect($('#newchat'));
  const clickPulse = (at) => tl.to(cursor, { scale: 0.86, duration: 0.07, yoyo: true, repeat: 1, ease: 'power1.inOut' }, at);

  // camera: scale + translate on the whole app so the focal point sits at the centre,
  // clamped so the frame never shows past the UI's edge
  function cameraMove(k, s0, scopes) {
    const s = k.scale ?? 1;
    let p = { x: 960, y: 540 };
    const f = k.focus;
    if (f?.el) {
      let n = null; for (const sc of scopes) { n = sc.querySelector(f.el); if (n) break; }
      if (!n) n = document.querySelector(f.el);
      const r = rect(n); p = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    } else if (f?.svg) {
      const svg = scopes[1].querySelector('svg');
      p = new DOMPoint(f.svg[0], f.svg[1]).matrixTransform(svg.getScreenCTM());
    } else if (f) p = { x: f.x, y: f.y };
    const x = Math.min(0, Math.max(1920 * (1 - s), 960 - p.x * s));
    const y = Math.min(0, Math.max(1080 * (1 - s), 540 - p.y * s));
    tl.to(app, { x, y, scale: s, duration: k.duration ?? 1, ease: k.ease ?? 'power2.inOut' }, s0 + k.at);
  }

  // ---- build the scenes ----------------------------------------------------------
  const messages = $('#messages'), planwrap = $('#planwrap'), typed = $('#typed');
  const sessions = [], plans = [];
  let sceneStart = 0;

  for (let si = 0; si < script.scenes.length; si++) {
    const sc = script.scenes[si];
    const T = sc.t, s0 = sceneStart;
    const at = (t) => s0 + t;

    // --- DOM: the chat session ---
    const session = el('div', 'session'); session.dataset.scene = sc.id; messages.append(session); sessions.push(session);
    const who = () => { const w = el('div', 'who'); w.append(el('span', null, script.chat.assistantLabel), el('span', 'badge', script.chat.assistantBadge)); return w; };
    const mGreeting = el('div', 'msg assistant'); mGreeting.append(who(), el('div', 'body', sc.greeting)); session.append(mGreeting);
    const mUser = el('div', 'msg user hidden-msg'); mUser.append(el('div', 'body', sc.prompt)); session.append(mUser);
    const mReply = el('div', 'msg assistant hidden-msg');
    const thinking = el('div', 'thinking'); const dotsEl = el('div', 'dots'); dotsEl.append(el('i'), el('i'), el('i')); const statusEl = el('div', 'status'); thinking.append(dotsEl, statusEl);
    const replyBody = el('div', 'body'); const table = el('table', 'areas'); const pillsEl = el('div', 'pills');
    mReply.append(who(), thinking, replyBody, table, pillsEl); session.append(mReply);
    const statusEls = sc.statusLines.map((t) => { const s = el('span', null, t); statusEl.append(s); return s; });
    const replyWords = words(replyBody, sc.reply);
    const rows = sc.table.map(([name, val]) => { const tr = el('tr'); const a = el('td', null, name); const b = el('td'); b.append(val); if (sc.tableUnit) b.append(el('small', null, sc.tableUnit)); tr.append(a, b); table.append(tr); return tr; });
    const pills = (sc.pills ?? []).map((t) => { const p = el('div', 'pill', t); pillsEl.append(p); return p; });
    let mUser2, mReply2, reply2Words;
    if (sc.click) {
      mUser2 = el('div', 'msg user hidden-msg'); mUser2.append(el('div', 'body', sc.pills[sc.click.pill])); session.append(mUser2);
      mReply2 = el('div', 'msg assistant hidden-msg'); const b2 = el('div', 'body'); mReply2.append(who(), b2); session.append(mReply2);
      reply2Words = words(b2, sc.click.reply);
    }
    // the typed characters live in the shared composer, one span each, built per scene
    const chars = [...sc.prompt].map((ch) => { const s = el('span', 'c', ch); typed.append(s); return s; });

    // --- DOM: the plan ---
    const plan = el('div', 'plan');
    plan.innerHTML = (await (await fetch(sc.plan)).text()).replace(/<\?xml[^>]*>/, '');
    planwrap.append(plan); plans.push(plan);
    const svg = plan.querySelector('svg');
    const pen = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    pen.innerHTML = '<circle r="7" fill="none" stroke="#141414" stroke-width="1"/><path d="M-11 0h7M4 0h7M0 -11v7M0 4v7" stroke="#141414" stroke-width="1"/>';
    pen.style.opacity = '0'; pen.classList.add('pen'); svg.append(pen);
    const scopes = [session, plan];
    if (si === 0) gsap.set(session, { autoAlpha: 1 });

    // --- cursor to the input, focus, type ---
    tl.to(cursor, { x: inputR.left + 160, y: inputR.top + inputR.height / 2 + 2, duration: T.focus - T.cursorToInput, ease: 'power2.inOut' }, at(T.cursorToInput));
    clickPulse(at(T.focus));
    tl.to('#input', { borderColor: '#141414', boxShadow: '0 0 0 3px rgba(20,20,20,0.08)', duration: 0.15 }, at(T.focus));
    tl.to('#caret', { opacity: 1, duration: 0.01 }, at(T.focus));
    tl.to('#placeholder', { opacity: 0, duration: 0.1 }, at(T.typingStart));
    tl.to('#send', { opacity: 1, duration: 0.2 }, at(T.typingStart));
    const blinks = Math.ceil(T.send - T.focus);
    tl.to('#caret', { opacity: 0, duration: 0.01, repeat: blinks, repeatDelay: 0.99, ease: 'none' }, at(T.focus + 0.5));
    tl.to('#caret', { opacity: 1, duration: 0.01, repeat: blinks, repeatDelay: 0.99, ease: 'none' }, at(T.focus + 1.0));
    const rand = rng(sc.typing.seed);
    let t = T.typingStart;
    chars.forEach((c) => {
      tl.to(c, { display: 'inline', opacity: 1, duration: 0.001 }, at(t));
      events.push({ t: at(t), kind: 'key' });
      t += (sc.typing.msPerChar + (rand() * 2 - 1) * sc.typing.jitterMs) / 1000;
    });
    const typingEnd = t;

    // --- send ---
    tl.to(cursor, { x: sendR.left + 16, y: sendR.top + 18, duration: 0.3, ease: 'power2.inOut' }, at(Math.max(typingEnd, T.send - 0.35)));
    clickPulse(at(T.send));
    tl.to('#send', { scale: 0.9, duration: 0.08, yoyo: true, repeat: 1 }, at(T.send));
    events.push({ t: at(T.send), kind: 'send' });
    tl.to(chars, { display: 'none', opacity: 0, duration: 0.001 }, at(T.send + 0.05));
    tl.to('#caret', { opacity: 0, duration: 0.001 }, at(T.send + 0.05));
    tl.to('#placeholder', { opacity: 1, duration: 0.2 }, at(T.send + 0.1));
    tl.to('#send', { opacity: 0.35, duration: 0.2 }, at(T.send + 0.1));
    tl.to('#input', { borderColor: '#d3cfc6', boxShadow: '0 0 0 0 rgba(20,20,20,0)', duration: 0.2 }, at(T.send + 0.1));
    tl.fromTo(mUser, { opacity: 0, y: 8, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, at(T.send + 0.05));
    tl.to(cursor, { x: 1180, y: 780, duration: 0.8, ease: 'power2.inOut' }, at(T.send + 0.3));

    // --- thinking ---
    tl.to(mReply, { opacity: 1, duration: 0.25 }, at(T.thinking));
    const thinkLen = T.reply - T.thinking;
    dotsEl.querySelectorAll('i').forEach((d, i) => tl.to(d, { opacity: 1, y: -3, duration: 0.32, yoyo: true, repeat: Math.ceil(thinkLen / 0.64) * 2 - 1, ease: 'sine.inOut' }, at(T.thinking + i * 0.14)));
    statusEls.forEach((s, i) => {
      const st = T.thinking + i * sc.statusEvery;
      tl.fromTo(s, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, at(st));
      if (i < statusEls.length - 1) tl.to(s, { opacity: 0, y: -6, duration: 0.25, ease: 'power2.in' }, at(st + sc.statusEvery - 0.25));
    });
    tl.to('#hint', { opacity: 0, duration: 0.4 }, at(T.thinking));
    tl.to('#drafting', { opacity: 1, y: 0, duration: 0.3 }, at(T.thinking));
    const spins = Math.ceil(thinkLen / 0.9);
    tl.fromTo('#drafting .spin', { rotation: 0 }, { rotation: 360 * spins, duration: spins * 0.9, ease: 'none', immediateRender: false }, at(T.thinking));
    tl.to('#shimmer', { opacity: 1, duration: 0.3 }, at(T.thinking));
    const sweeps = Math.ceil(thinkLen / 1.8);
    tl.fromTo('#shimmer', { xPercent: 0 }, { xPercent: 300, duration: 1.8, repeat: sweeps - 1, ease: 'sine.inOut', immediateRender: false }, at(T.thinking));

    // --- the plan draws itself: top-level layers in document order ---
    tl.to(plan, { autoAlpha: 1, duration: 0.001 }, at(T.draw - 0.01));
    const layers = [...svg.children].filter((n) => n.tagName === 'g' && n.id);
    layers.forEach((g) => g.querySelectorAll('text').forEach((n) => { n.style.opacity = '0'; }));
    let cursorT = T.draw;
    for (const g of layers) {
      const id = g.id;
      const dur = sc.layers[id] ?? 1.0;
      const nodes = [...g.querySelectorAll('*')].filter((n) => isStrokeShape(n) || n.tagName === 'text');
      if (id === 'labels') {
        const groups = [...g.querySelectorAll('g.label')];
        const each = dur / Math.max(1, groups.length);
        groups.forEach((grp, i) => {
          grp.querySelectorAll('text').forEach((n) => { n.style.opacity = ''; });
          grp.style.opacity = '0';
          tl.to(grp, { opacity: 1, y: 0, duration: Math.min(0.45, each * 1.6), ease: 'power2.out' }, at(cursorT + i * each));
        });
        cursorT += dur;
        continue;
      }
      const strokes = nodes.filter(drawable);
      const reveals = nodes.filter((n) => !drawable(n));
      const lens = strokes.map((n) => n.getTotalLength());
      const totalLen = lens.reduce((a, b) => a + b, 0) || 1;
      const drawTime = dur * (id === 'dims' ? 0.7 : 1);
      let tt = cursorT;
      strokes.forEach((n, i) => {
        const len = lens[i];
        const d = Math.max(0.02, (len / totalLen) * drawTime);
        // hidden offset sits a few units past the length so a square cap cannot peek out as a dot
        n.style.strokeDasharray = `${len} ${len + 8}`;
        n.style.strokeDashoffset = `${len + 4}`;
        tl.to(n, { strokeDashoffset: 0, duration: d, ease: 'none' }, at(tt));
        penSchedule.push({ start: at(tt), end: at(tt + d), el: n, len, svg, pen });
        const grp = n.parentNode;
        reveals.filter((x) => x.parentNode === grp && x.tagName !== 'text' && !x.dataset.revealed).forEach((x) => {
          x.dataset.revealed = '1'; x.style.opacity = '0';
          tl.to(x, { opacity: 1, duration: 0.001 }, at(tt));
        });
        tt += d;
      });
      const texts = reveals.filter((x) => x.tagName === 'text');
      texts.forEach((x, i) => tl.to(x, { opacity: 1, duration: 0.25 }, at(cursorT + drawTime + (dur - drawTime) * (i / Math.max(1, texts.length)))));
      reveals.filter((x) => x.tagName !== 'text' && !x.dataset.revealed).forEach((x) => { x.style.opacity = '0'; tl.to(x, { opacity: 1, duration: 0.25 }, at(cursorT + drawTime)); });
      cursorT += dur;
    }

    // --- reply streams, table, pills ---
    tl.to(thinking, { opacity: 0, height: 0, marginTop: -8, duration: 0.25 }, at(T.reply - 0.1));
    tl.to('#drafting', { opacity: 0, y: -6, duration: 0.25 }, at(T.reply - 0.2));
    tl.to('#shimmer', { opacity: 0, duration: 0.3 }, at(T.reply - 0.3));
    events.push({ t: at(T.reply), kind: 'chime' });
    replyWords.forEach((w, i) => tl.to(w, { opacity: 1, duration: 0.12 }, at(T.reply + i / sc.replyWordsPerSecond)));
    tl.to(table, { opacity: 1, duration: 0.01 }, at(T.table - 0.01));
    rows.forEach((row, i) => tl.fromTo(row, { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, at(T.table + i * 0.1)));
    pills.forEach((p, i) => tl.to(p, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, at(T.pills + i * 0.1)));

    // --- click a pill: edit or export ---
    if (sc.click) {
      const C = sc.click, pill = pills[C.pill];
      // measured now, at camera scale 1, with the thinking row collapsed as it is at click time
      thinking.style.display = 'none'; const pillR = rect(pill); thinking.style.display = '';
      tl.to(cursor, { x: pillR.left + 60, y: pillR.top + 20, duration: T.click - T.cursorToPill, ease: 'power2.inOut' }, at(T.cursorToPill));
      tl.to(pill, { backgroundColor: '#f1efe9', duration: 0.15 }, at(T.click - 0.15));
      clickPulse(at(T.click));
      events.push({ t: at(T.click), kind: 'click' });
      tl.to(pill, { backgroundColor: '#141414', color: '#ffffff', borderColor: '#141414', scale: 0.97, duration: 0.08 }, at(T.click));
      tl.to(pill, { scale: 1, duration: 0.12 }, at(T.click + 0.08));
      const others = pills.filter((p) => p !== pill);
      if (others.length) tl.to(others, { opacity: 0.35, duration: 0.2 }, at(T.click + 0.05));
      tl.fromTo(mUser2, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, at(T.click + 0.25));
      tl.to(cursor, { x: 1180, y: 820, duration: 0.9, ease: 'power2.inOut' }, at(T.click + 0.4));
      if (C.action === 'edit') {
        svg.querySelectorAll('[data-after]').forEach((n) => {
          const a = JSON.parse(n.dataset.after);
          if (a.transform && !n.getAttribute('transform')) n.setAttribute('transform', 'translate(0,0)');
          tl.to(n, { attr: a, duration: C.duration, ease: 'power3.inOut' }, at(C.start));
        });
        for (const c of C.counters ?? []) {
          const obj = { v: c.from };
          counters.push({ el: svg.querySelector('#' + c.id), obj, format: c.format, suffix: c.suffix ?? '' });
          tl.to(obj, { v: c.to, duration: C.duration, ease: 'power3.inOut' }, at(C.start));
        }
        events.push({ t: at(C.start + C.duration), kind: 'chime' });
      } else if (C.action === 'export') {
        $('#toastlabel').textContent = C.toast;
        tl.fromTo('#toast', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, at(C.toastAt));
        tl.to('#toast', { autoAlpha: 0, y: 6, duration: 0.3 }, at(T.end - 0.3));
        events.push({ t: at(C.toastAt), kind: 'chime' });
      }
      tl.to(mReply2, { opacity: 1, duration: 0.2 }, at(C.replyAt - 0.1));
      reply2Words.forEach((w, i) => tl.to(w, { opacity: 1, duration: 0.12 }, at(C.replyAt + i / sc.replyWordsPerSecond)));
    }

    // --- camera ---
    for (const k of sc.camera ?? []) cameraMove(k, s0, scopes);

    // --- transition to the next scene: New chat ---
    const E = at(T.end);
    if (si < script.scenes.length - 1) {
      const TR = script.transition;
      const clickAt = E + TR.cursorToNew;
      tl.to(cursor, { x: newR.left + newR.width / 2, y: newR.top + newR.height / 2 + 2, duration: TR.cursorToNew, ease: 'power2.inOut' }, E);
      clickPulse(clickAt);
      tl.to('#newchat', { backgroundColor: '#141414', color: '#ffffff', borderColor: '#141414', duration: 0.1 }, clickAt);
      tl.to('#newchat', { backgroundColor: '#ffffff', color: '#141414', borderColor: '#d3cfc6', duration: 0.3 }, clickAt + 0.35);
      events.push({ t: clickAt, kind: 'click' });
      tl.to(session, { autoAlpha: 0, y: -10, duration: 0.4, ease: 'power2.in' }, clickAt + 0.1);
      tl.to(plan, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, clickAt + 0.1);
      tl.to('#hint', { opacity: 1, duration: 0.4 }, clickAt + 0.5);
      tl.to('#filename', { opacity: 0, duration: 0.15 }, clickAt + 0.1);
      tl.to('#filename', { opacity: 1, duration: 0.2 }, clickAt + 0.5);
      nameSchedule.push({ t: clickAt + 0.5, name: script.scenes[si + 1].fileName });
      tl.to(cursor, { x: 1180, y: 760, duration: 0.6, ease: 'power2.inOut' }, clickAt + 0.2);
      sceneStart = clickAt + TR.settle;
      pendingShow.push({ index: si + 1, t: sceneStart - 0.3 });
    } else {
      sceneStart = E;
    }
  }
  for (const p of pendingShow) tl.to(sessions[p.index], { autoAlpha: 1, duration: 0.3 }, p.t);

  // ---- outro -----------------------------------------------------------------
  const O = script.outro;
  const outroAt = sceneStart + O.holdBefore;
  tl.to(cursor, { opacity: 0, duration: 0.3 }, outroAt);
  tl.to('#outro', { opacity: 1, duration: O.fade, ease: 'power2.inOut' }, outroAt);
  tl.to('#outro-wordmark', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, outroAt + 0.6);
  tl.to('#outro-line', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, outroAt + 0.95);
  const END = outroAt + O.hold;
  tl.set({}, {}, END);

  // ---- seek ----------------------------------------------------------------
  function updatePen(time) {
    const s = penSchedule.find((p) => time >= p.start && time < p.end);
    for (const p of document.querySelectorAll('.plan .pen')) if (!s || p !== s.pen) p.style.opacity = '0';
    if (!s) return;
    const p = (time - s.start) / (s.end - s.start);
    let pt;
    try { pt = s.el.getPointAtLength(p * s.len); } catch { return; }
    const m = s.el.getScreenCTM(), root = s.svg.getScreenCTM();
    if (m && root) pt = new DOMPoint(pt.x, pt.y).matrixTransform(root.inverse().multiply(m));
    s.pen.setAttribute('transform', `translate(${pt.x.toFixed(2)},${pt.y.toFixed(2)})`);
    s.pen.style.opacity = '1';
  }
  function updateCounters() {
    for (const c of counters) c.el.textContent = (c.format === 'ftin' ? numToFt(c.obj.v) : String(Math.round(c.obj.v))) + c.suffix;
  }
  function updateName(time) {
    let name = script.scenes[0].fileName;
    for (const n of nameSchedule) if (time >= n.t) name = n.name;
    $('#filename').textContent = name;
  }
  window.seek = (seconds) => {
    tl.seek(Math.max(0, Math.min(END, seconds)), true);
    updatePen(seconds);
    updateCounters();
    updateName(seconds);
    void document.body.offsetHeight;   // force layout
  };
  window.duration = END;
  window.fps = script.video.fps;
  events.sort((a, b) => a.t - b.t);

  await document.fonts.ready;
  updateCounters();
  window.seek(0);
  window.ready = true;

  // ---- preview scrub bar -----------------------------------------------------
  if (location.search.includes('scrub')) {
    document.body.classList.add('scrub');
    const range = $('#scrub input'); range.max = Math.round(END * script.video.fps);
    const show = (f) => { window.seek(f / script.video.fps); $('#scrub-time').textContent = (f / script.video.fps).toFixed(3); $('#scrub-frame').textContent = 'f' + f; range.value = f; };
    range.addEventListener('input', () => show(+range.value));
    let playing = null;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') show(Math.min(+range.max, +range.value + (e.shiftKey ? 60 : 1)));
      if (e.key === 'ArrowLeft') show(Math.max(0, +range.value - (e.shiftKey ? 60 : 1)));
      if (e.key === ' ') { e.preventDefault(); if (playing) { clearInterval(playing); playing = null; } else { playing = setInterval(() => { const f = +range.value + 1; if (f > +range.max) { clearInterval(playing); playing = null; } else show(f); }, 1000 / script.video.fps); } }
    });
  }
})();
</script>
</body>
</html>
