<!--
  Plinth teaser floor plan. Hand-authored. Scale: 1 ft = 20 px. Origin (0 ft, 0 ft) is at (70, 120) px; north is up.
  Layers are <g> elements in draw order: walls-outer, walls-interior, openings, labels, furniture, dims.
  Elements with a data-after attribute carry their "living room bigger" state; the timeline morphs to it.

  Room areas (carpet, wall faces as drawn):
  Living      15'0" x 12'0"  =  180.00 sq ft
  Bedroom 3   12'6" x 8'0"   =  100.00 sq ft
  Bedroom 2   12'6" x 8'5"   =  105.21 sq ft
  Bedroom 1   12'6" x 9'7"   =  119.79 sq ft
  Bath 1       5'0" x 7'0"   =   35.00 sq ft
  Bath 2       5'0" x 7'0"   =   35.00 sq ft
  Kitchen     10'0" x 9'0"   =   90.00 sq ft
  Lobby       10'0" x 5'0"   =   50.00 sq ft  (circulation, not counted)
  Balcony     12'0" x 2'9"   =   33.00 sq ft
  Listed total               = 698 sq ft (698 target)
  After "make the living room bigger": wall x=15 -> x=17 for y 0..8. Living 180+16=196, Bedroom 3 12'6"x8'0" -> 10'6"x8'0" = 84.
-->
